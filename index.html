<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Website</title>
  <style>
    :root { --bg: #f7f7f5; --fg: #1f1f1f; --muted: #6b6b6b; --accent: #3b6ef5; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #161616; --fg: #ececec; --muted: #9a9a9a; --accent: #7b9cff; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
      padding: 16px;
    }
    main { text-align: center; max-width: 560px; }
    h1 { font-size: clamp(2rem, 6vw, 3rem); margin: 0 0 12px; }
    p { color: var(--muted); line-height: 1.6; margin: 0; }
    .badge {
      display: inline-block; margin-bottom: 20px; padding: 4px 12px;
      border: 1px solid var(--accent); color: var(--accent);
      border-radius: 999px; font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <main>
    <span class="badge">준비 중</span>
    <h1>지은아 사랑해</h1>
    <p>GitHub Pages로 배포된 임시 페이지입니다.<br>곧 새로운 내용으로 찾아올게요.</p>
  </main>
</body>
</html>
